# Python stack
- id: pip-cache
  name: pip cache
  path: "%LOCALAPPDATA%/pip/cache"
  kind: clean_contents
  group: Python
  safe: safe
  describe: "Default wheel cache (pip docs: pip cache dir = %LocalAppData%\\pip\\cache, purge = remove all items); equivalent of pip cache purge without freezing pip itself, redownloaded on next install"
  os: [windows]
