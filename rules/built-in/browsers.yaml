# Browsers tab: NEVER delete profile fully — only cache subpaths per checkbox.
# Chromium: caches live under User Data/<profile>/ (Default AND Profile 1..N — globbed).
# Firefox family: cache2/startupCache in %LOCALAPPDATA%, shader-cache in %APPDATA%.
# Opera: disk Cache in Local, Code Cache/GPU caches in Roaming — split into two rules.
# *_trace rules (tier: userdata): history/cookies/downloads — size + instructions, never deleted.
# processes = exe names warned about in confirm dialog while they hold locks.
- id: chrome-cache-selected
  tier: safe
  name: Cache (all profiles)
  program: Chrome
  path: "%LOCALAPPDATA%/Google/Chrome/User Data"
  kind: clean_selected
  careful_subpaths: [Service Worker, IndexedDB, File System]
  subpaths: ["*/Cache", "*/Code Cache", "*/GPUCache", "*/DawnGraphiteCache", "*/DawnWebGPUCache", "*/image_cache", "*/AutofillAiModelCache", "*/optimization_guide_hint_cache_store", "*/Service Worker", "*/IndexedDB", "*/File System"]
  category: browsers
  safe: safe
  describe: "Close Chrome first; logins/bookmarks kept"
  processes: [chrome.exe, googlechrome.exe]
  os: [windows]
- id: chrome-browsing-trace
  tier: userdata
  name: History & cookies
  program: Chrome
  path: "%LOCALAPPDATA%/Google/Chrome/User Data"
  kind: clean_selected
  subpaths: ["*/History", "*/Network/Cookies", "*/Cookies", "*/Web Data", "*/Sessions", "*/Login Data"]
  category: browsers
  safe: careful
  processes: [chrome.exe, googlechrome.exe]
  describe: "Size shown for reference. Clean yourself (Ctrl+Shift+Del): only History + Downloads (+ cached images if wanted). IMPORTANT: cookies, saved passwords, autofill and open tabs are KEEP - never delete them; program never touches these"
  os: [windows]
