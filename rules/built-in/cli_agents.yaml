# CLI AI agents: session histories (YOUR context). All manual review — never auto-deleted.
# Paths verified from official docs/sources. Settings/keys live next to sessions — don't hand-delete.
- id: qwen-sessions
  name: Qwen Code sessions
  path: "%USERPROFILE%/.qwen/projects"
  kind: manual
  category: devtools
  program: Qwen Code
  safe: careful
  tier: userdata
  describe: "Per-project chats (JSONL). settings.json stays outside — untouched. file-history auto-cleans after 30d"
  os: [windows]
- id: qwen-history
  name: Qwen Code rewind backups
  path: "%USERPROFILE%/.qwen/file-history"
  kind: manual
  category: devtools
  program: Qwen Code
  safe: careful
  tier: userdata
  describe: "Session backups for /rewind (cleanupPeriodDays, default 30d)"
  os: [windows]
- id: gemini-sessions
  name: Gemini CLI sessions
  path: "%USERPROFILE%/.gemini/tmp"
  kind: manual
  category: devtools
  program: Gemini CLI
  safe: careful
  tier: userdata
  describe: "Per-project chats + shell history. Auto-retention 30d (sessionRetention). settings.json untouched"
  os: [windows]
- id: codex-sessions
  name: Codex CLI sessions
  path: "%USERPROFILE%/.codex/sessions"
  kind: manual
  category: devtools
  program: Codex CLI
  safe: careful
  tier: userdata
  describe: "Rollout JSONL (+zst). Official flow: codex archive <id>; old: find -mtime +30 -delete"
  os: [windows]
- id: copilot-sessions
  name: Copilot CLI sessions
  path: "%USERPROFILE%/.copilot/session-state"
  kind: manual
  category: devtools
  program: Copilot CLI
  safe: careful
  tier: userdata
  describe: "YAML+JSONL session state"
  os: [windows]
- id: kimi-sessions
  name: Kimi CLI sessions
  path: "%USERPROFILE%/.kimi/sessions"
  kind: manual
  category: devtools
  program: Kimi CLI
  safe: careful
  tier: userdata
  describe: "wire.jsonl event streams per working dir; kimi export <id> for backup"
  os: [windows]
- id: kimi-data
  name: Kimi CLI data
  path: "%USERPROFILE%/.kimi-code"
  kind: manual
  category: devtools
  program: Kimi CLI
  safe: careful
  tier: userdata
  describe: "config.toml + session_index + logs. Review before touching config"
  os: [windows]
- id: zcode-data
  name: ZCode data (~/.zcode)
  path: "%USERPROFILE%/.zcode"
  kind: manual
  category: devtools
  program: ZCode (Z.ai)
  safe: careful
  tier: userdata
  describe: "Z.ai's GLM harness: config.json, AGENTS.md, agents/skills/commands are yours. cli/exec never auto-cleans"
  os: [windows]
  options:
  - id: cli-exec
    name: cli/exec (terminal output cache)
    path: "%USERPROFILE%/.zcode/cli/exec"
    kind: clean_contents
    safe: safe
    describe: "Past-session terminal command output; official FAQ: safe to delete whole dir with ZCode fully quit"
- id: minimax-code-data
  name: MiniMax Code data (~/.minimax)
  path: "%USERPROFILE%/.minimax"
  kind: manual
  category: devtools
  program: MiniMax Code (mcode)
  safe: careful
  tier: userdata
  describe: "config.yaml, sessions, logs, plugins, skills (MINIMAX_DATA_DIR override). Official uninstall note: back up sessions first"
  os: [windows]
  options:
  - id: logs
    name: Logs only
    path: "%USERPROFILE%/.minimax/logs"
    kind: clean_contents
    safe: safe
    describe: Runtime logs, recreated
- id: minimax-code-install
  name: MiniMax Code installer dir (~/.minimax-code)
  path: "%USERPROFILE%/.minimax-code"
  kind: manual
  category: devtools
  program: MiniMax Code (mcode)
  safe: careful
  tier: userdata
  describe: "CL binaries from install.ps1. After uninstall these can remain - delete yourself"
  os: [windows]
- id: omp-data
  name: omp agent data (~/.omp)
  path: "%USERPROFILE%/.omp"
  kind: manual
  category: devtools
  program: omp (Oh My Pi)
  safe: careful
  tier: userdata
  describe: "agent/config.yml, AGENTS.md, personal rules - your setup. Project .omp/ dirs live inside repos (not scanned)"
  os: [windows]
- id: nanobot-data
  name: nanobot data (~/.nanobot)
  path: "%USERPROFILE%/.nanobot"
  kind: manual
  category: devtools
  program: nanobot (HKUDS)
  safe: careful
  tier: userdata
  describe: "config.json + workspace with memory/skills/cron - the agent's brain. Alternative instances use ./.nanobot-A/"
  os: [windows]
  options:
  - id: sessions
    name: sessions/
    path: "%USERPROFILE%/.nanobot/sessions"
    kind: clean_contents
    safe: careful
    describe: "Per-workspace chat history (outside agent workspace); resumes gone after delete"
  - id: media
    name: media/
    path: "%USERPROFILE%/.nanobot/media"
    kind: clean_contents
    safe: safe
    describe: "Runtime media attachments from chats"
- id: claude-mem-data
  name: claude-mem data (~/.claude-mem)
  path: "%USERPROFILE%/.claude-mem"
  kind: manual
  category: devtools
  program: claude-mem
  safe: careful
  tier: userdata
  describe: "SQLite memory of your Claude Code sessions (claude-mem.db) + settings.json + logs; worker daemon may be running"
  os: [windows]
  options:
  - id: logs
    name: Logs only
    path: "%USERPROFILE%/.claude-mem/logs"
    kind: clean_contents
    safe: safe
    describe: Plain logs
- id: cline-tasks
  name: Cline tasks
  path: "%APPDATA%/Code/User/globalStorage/saoudrizwan.claude-dev/tasks"
  kind: manual
  category: devtools
  program: Cline
  safe: careful
  tier: userdata
  describe: "Per-task histories in VS Code globalStorage"
  os: [windows]
- id: roo-tasks
  name: Roo Code tasks
  path: "%APPDATA%/Code/User/globalStorage/rooveterinaryinc.roo-cline/tasks"
  kind: manual
  category: devtools
  program: Roo Code
  safe: careful
  tier: userdata
  describe: "Per-task histories in VS Code globalStorage"
  os: [windows]
- id: kilo-ide-tasks
  name: Kilo IDE tasks
  path: "%APPDATA%/Code/User/globalStorage/kilocode.kilo-code/tasks"
  kind: manual
  category: devtools
  program: Kilo Code
  safe: careful
  tier: userdata
  describe: "Legacy v5 leftovers can be GBs and are never auto-cleaned (official issue)"
  os: [windows]
- id: kiro-data
  name: Kiro data (~/.kiro)
  path: "%USERPROFILE%/.kiro"
  kind: manual
  category: devtools
  program: Kiro
  safe: careful
  tier: userdata
  describe: "SQLite session DB + agents. Review, don't wipe blindly"
  os: [windows]
- id: antigravity-data
  name: Antigravity data
  path: "%USERPROFILE%/.gemini/antigravity"
  kind: manual
  category: devtools
  program: Antigravity
  safe: careful
  tier: userdata
  describe: "PB + brain artifacts of Google's agent IDE"
  os: [windows]
- id: codex-archived
  name: Codex CLI archived sessions
  path: "%USERPROFILE%/.codex/archived_sessions"
  kind: manual
  category: devtools
  program: Codex CLI
  safe: careful
  tier: userdata
  describe: "Sessions shelved by 'codex archive' (JSONL+zst). Restore with 'codex unarchive <id>'"
  os: [windows]
- id: codex-tui-log
  name: Codex CLI TUI logs
  path: "%USERPROFILE%/.codex/log"
  kind: clean_contents
  category: devtools
  program: Codex CLI
  safe: safe
  tier: safe
  describe: "codex-tui.log can reach GBs in long sessions (known issue); recreated on next run"
  os: [windows]
- id: trae-sessions
  name: Trae agent data (~/.trae)
  path: "%USERPROFILE%/.trae"
  kind: manual
  category: devtools
  program: Trae
  safe: careful
  tier: userdata
  describe: "Session index + skills of ByteDance's agent IDE / TraeCli harness. Skills are your setup — review"
  os: [windows]
- id: iflow-data
  name: iFlow CLI data
  path: "%USERPROFILE%/.iflow"
  kind: manual
  category: devtools
  program: iFlow CLI
  safe: careful
  tier: userdata
  describe: "settings.json (API key!) + session files. Service shut down 2026 — likely leftovers only"
  os: [windows]
- id: goose-sessions
  name: goose sessions
  path: "%APPDATA%/Block/goose/data"
  kind: manual
  category: devtools
  program: goose
  safe: careful
  tier: userdata
  exclude: [logs]
  describe: "sessions.db conversations + history.txt — YOUR context. Back up first: goose session export"
  os: [windows]
- id: goose-logs
  name: goose CLI logs
  path: "%APPDATA%/Block/goose/data/logs"
  kind: clean_contents
  category: devtools
  program: goose
  safe: safe
  tier: safe
  describe: "Daily subdirs; goose prunes older than 2 weeks itself, manual clean is instant"
  os: [windows]
- id: aider-histories
  name: Aider chat histories
  path: ""
  kind: old_versions
  parent: "%USERPROFILE%"
  match: ".aider*"
  keep: []
  category: devtools
  program: Aider
  safe: careful
  tier: userdata
  describe: ".aider.chat.history.md / .aider.input.history (markdown logs per project) + tags cache. YOUR chats — review manually"
  os: [windows]
- id: crush-data
