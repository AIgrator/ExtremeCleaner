# Media: video editors and music. CCleaner doesn't touch these.
# Render/preview caches regenerate; offline downloads redownload.
- id: capcut-cache
  name: CapCut cache
  path: "%LOCALAPPDATA%/CapCut/User Data/Cache"
  kind: clean_contents
  category: media
  safe: safe
  describe: "Close CapCut first; effects/fonts redownload on demand. Settings shows less than folder (resources vs preview cache)"
  processes: [capcut.exe]
  os: [windows]
- id: premiere-media-cache
  program: Adobe
  name: Premiere Pro media cache
  path: "%APPDATA%/Adobe/Common"
  kind: clean_selected
  subpaths: [Media Cache Files, Media Cache]
  category: media
  safe: safe
  describe: "Shared DB with After Effects/Media Encoder/Audition — one cleanup covers all. Close Adobe apps first; hundreds of GB over years"
  processes: [afterfx.exe, "premiere pro.exe", "adobe media encoder.exe", audition.exe, lightroom.exe, photoshop.exe]
  os: [windows]
- id: after-effects-disk-cache
  tier: safe
  program: Adobe
  name: After Effects disk cache
  path: "%APPDATA%/Adobe"
  kind: run_command
  command: "AE > Edit > Purge > All Memory & Disk Cache (location: Preferences > Media & Disk Cache > Empty Disk Cache)"
  docs: "https://www.youtube.com/watch?v=uCeu-ok1JSU"
  category: media
  safe: careful
  describe: "SIZE ONLY + in-app cleanup. Disk Cache path is user-set; RAM previews regenerate"
  os: [windows]
- id: camera-raw-cache
  program: Adobe
  name: Camera Raw cache
  path: "%LOCALAPPDATA%/Adobe/CameraRaw/Cache"
  kind: clean_contents
  category: media
  safe: safe
  describe: "Shared by Photoshop/Bridge/Lightroom; raw previews rebuild on demand"
  os: [windows]
- id: lightroom-previews
  tier: safe
  name: Lightroom previews
  path: "%USERPROFILE%/Pictures/Lightroom"
  kind: run_command
  command: "Lightroom > Library > Previews > Discard 1:1 / Smart Previews"
  category: media
  safe: careful
  describe: "SIZE ONLY + in-app cleanup. *.lrdata next to catalog rebuild slowly — keep if you browse offline"
  os: [windows]
- id: davinci-cache
  tier: safe
  name: DaVinci Resolve render cache
  path: "%APPDATA%/Blackmagic Design"
  kind: run_command
  command: "Resolve > Playback > Delete Render Cache > All (cache path: Preferences > Media Storage)"
  docs: "https://www.youtube.com/watch?v=1_FmnuQcLwo"
  category: media
  safe: careful
  describe: "SIZE ONLY + in-app cleanup. Cases of 400-900 GB. Never delete databases by hand — projects live nearby"
  os: [windows]
- id: spotify-data
  name: Spotify songs cache
  path: "%LOCALAPPDATA%/Spotify/Data"
  kind: clean_contents
  category: media
  safe: careful
  describe: "Close Spotify first. Includes OFFLINE downloads — for cache-only use Settings > Storage > Clear cache, or set storage.size limit in prefs file"
  processes: [spotify.exe]
  os: [windows]

