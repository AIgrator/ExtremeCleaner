- id: game-save-hubs
  name: Save game hubs
  path: ""
  kind: manual
  category: games
  safe: careful
  tier: userdata
  describe: "One hub holds saves of dozens of titles. Uninstalled games leave theirs behind — review per folder"
  os: [windows]
  options:
    - id: my-games
      name: Documents/My Games
      path: "%USERPROFILE%/Documents/My Games"
      kind: manual
      safe: careful
      describe: "Bethesda, 2K, Firaxis and many mid-size publishers"
    - id: saved-games
      name: Saved Games folder
      path: "%USERPROFILE%/Saved Games"
      kind: manual
      safe: careful
      describe: "Microsoft first-party + indies"
    - id: ea-games
      name: Documents/EA Games
      path: "%USERPROFILE%/Documents/EA Games"
      kind: manual
      safe: careful
      describe: "EA App titles"
    - id: rockstar
      name: Documents/Rockstar Games
      path: "%USERPROFILE%/Documents/Rockstar Games"
      kind: manual
      safe: careful
      describe: "GTA/RDR profiles and saves"
    - id: paradox
      name: Documents/Paradox Interactive
      path: "%USERPROFILE%/Documents/Paradox Interactive"
      kind: manual
      safe: careful
      describe: "CK3/EU4/Stellaris saves (can be GBs with mods)"
- id: steam-userdata
  name: Steam userdata (all saves)
  path: "C:/Program Files (x86)/Steam/userdata"
  kind: manual
  category: games
  program: Steam
  safe: careful
  tier: userdata
  describe: "Per-game folders (appid): saves, configs, screenshots (760/remote). Stays after uninstall — check Steam Cloud first"
  os: [windows]
- id: unity-saves
  name: Unity games data (LocalLow)
  path: "%USERPROFILE%/AppData/LocalLow"
  kind: manual
  category: games
  program: Unity
  safe: careful
  tier: userdata
  describe: "Almost all Unity titles save here (Cult of the Lamb, Valheim, Hollow Knight...). Review per studio folder"
  os: [windows]
- id: ubisoft-savegames
  name: Ubisoft savegames
  path: "%ProgramFiles(x86)%/Ubisoft/Ubisoft Game Launcher/savegames"
  kind: manual
  category: games
  program: Ubisoft
  safe: careful
  tier: userdata
  describe: "Numbered per-game dirs (AC=273/5059..., FC=46). Needs admin to browse"
  os: [windows]
- id: xbox-saves
  name: Xbox/MS Store saves (wgs containers)
  path: ""
  kind: old_versions
  parent: "%LOCALAPPDATA%/Packages"
  match: "*/SystemAppData/wgs"
  keep: []
  category: games
  safe: careful
  tier: userdata
  describe: "Sandboxed per-game containers (GUID names). Needs ownership to browse; access errors are normal"
  os: [windows]
- id: minecraft-worlds
  name: Minecraft worlds
  path: "%APPDATA%/.minecraft/saves"
  kind: manual
  category: games
  program: Minecraft
  safe: careful
  tier: userdata
  describe: "YOUR worlds — never auto-touched. Delete abandoned ones yourself"
  os: [windows]
- id: roblox-versions
  name: Roblox old clients
  path: ""
  kind: old_versions
  parent: "%LOCALAPPDATA%/Roblox/Versions"
  match: "version-*"
  keep: []
  category: games
  program: Roblox
  safe: careful
  tier: safe
  describe: "Superseded version-* dirs pile up; launcher refetches the current one. Keep newest by date if unsure"
  os: [windows]
- id: roblox-logs
  name: Roblox logs
  path: "%LOCALAPPDATA%/Roblox/logs"
  kind: clean_contents
  category: games
  program: Roblox
  safe: safe
  tier: safe
  describe: "Plain client logs"
  os: [windows]
