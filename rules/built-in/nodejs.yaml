# Node.js stack (Windows paths; same idea on linux/darwin with ~/.npm)
- id: npm-cache
  name: NPM cache
  path: "%LOCALAPPDATA%/npm-cache"
  kind: clean_contents
  group: Node.js
  safe: safe
  describe: "npm docs: cache dir = %LocalAppData%\\npm-cache, 'npm cache is strictly a cache... clear only to reclaim disk space' - same as npm cache clean --force without freezing npm itself, redownloaded on next install"
  os: [windows]
