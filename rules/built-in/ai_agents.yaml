    name: database (embeddings)
    path: '%USERPROFILE%/.codeium/windsurf/database'
    kind: clean_contents
    safe: safe
    describe: 'Vector index of your codebase, rebuilt on next reindex'
  - id: cascade-tmp
    name: cascade temp (.tmp)
    path: '%USERPROFILE%/.codeium/windsurf/cascade'
    kind: manual
    safe: careful
    describe: 'cascade/ holds .pb conversations + huge .tmp dumps; delete only *.tmp yourself - .pb = history'
