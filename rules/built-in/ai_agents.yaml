  program: Windsurf
  name: Windsurf Cascade agent data (~/.codeium/windsurf)
  path: '%USERPROFILE%/.codeium/windsurf'
  kind: manual
  category: devtools
  safe: careful
  tier: userdata
  describe: 'Cascade chats (.pb), per-workspace memories (official docs: ~/.codeium/windsurf/memories/), rules/workflows, embeddings DB. Quit Windsurf before cleaning anything here'
  os: [windows]
  options:
