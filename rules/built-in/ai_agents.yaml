  program: Claude Code
  name: Claude Code project memory cache
  kind: clean_selected
  category: devtools
  safe: safe
  describe: 'memoryCache chunks next to sessions, rebuilt. Sessions/memory/ untouched'
  os:
  - windows
  options:
