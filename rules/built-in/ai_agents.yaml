    name: memoryCache (per project)
    parent: '%USERPROFILE%/.claude/projects'
    match: '*/memoryCache'
    kind: clean_contents
    safe: safe
    describe: 'Conversation memory cache, rebuilt on demand'
- id: claude-sessions
  program: Claude Code
  name: Claude Code sessions (~/.claude/projects)
  path: '%USERPROFILE%/.claude/projects'
  kind: run_command
  command: Delete .jsonl sessions older than 30 days, keep memory/ and active session
    (or use claude-clean)
  category: devtools
  safe: careful
  describe: SIZE ONLY + manual cleanup. 100MB-3GB of past conversations; resume needs
    them
  os:
  - windows
