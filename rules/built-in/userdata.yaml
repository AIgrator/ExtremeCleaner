# User data: shown with size + open-in-Explorer. The program NEVER deletes these.
# Screenshots and downloads are YOUR files — review them yourself.
- id: screenshots
  name: Screenshots (Pictures)
  path: ""
  kind: manual
  category: media
  safe: careful
  tier: userdata
  describe: "Win+Shift+S and app shots land here (plain Pictures/Screenshots; the OneDrive cloud mirror has its own row below). YOUR images — review yourself"
  os: [windows]
  options:
    - id: standard
      name: Pictures/Screenshots
      path: "{PICTURES}/Screenshots"
      kind: manual
      safe: careful
      describe: ""
- id: screen-recorder-output
  name: Screen captures & recordings (recorder defaults)
  path: ""
  kind: manual
  category: media
  safe: careful
  tier: userdata
  describe: "Fraps and other recorders save captures here by default. YOUR shots/videos — review, delete by hand"
  os: [windows]
  options:
    - id: fraps
      name: Fraps captures
      path: "%SystemDrive%/Fraps"
      kind: manual
      safe: careful
      describe: "fraps.com FAQ: screenshot/movie folder defaults to the Fraps install directory; huge uncompressed AVI/BMP piles accumulate there. OBS/ShadowPlay save into the Videos row instead"
- id: gamebar-captures
  name: Xbox Game Bar captures
  path: ""
  kind: manual
  category: media
  program: Xbox Game Bar
  safe: careful
  tier: userdata
  describe: "Win+G clips (MP4) and shots (PNG). YOUR captures — review yourself"
  os: [windows]
  options:
    - id: clips
      name: Videos/Captures
      path: "{VIDEOS}/Captures"
      kind: manual
      safe: careful
      describe: ""
    - id: shots
      name: Pictures/Xbox Screenshots
      path: "{PICTURES}/Xbox Screenshots"
      kind: manual
      safe: careful
      describe: ""
- id: sharex-shots
  name: ShareX screenshots
  path: "{DOCUMENTS}/ShareX"
  kind: manual
  category: media
  program: ShareX
  safe: careful
  tier: userdata
  describe: "Default output (Screenshots/ by month). Custom folder is set in App Settings > Paths"
  os: [windows]
- id: bandicam-output
  name: Bandicam output
  path: "{DOCUMENTS}/Bandicam"
  kind: manual
  category: media
  program: Bandicam
  safe: careful
  tier: userdata
  describe: "Default output folder; check Output settings if customized"
  os: [windows]
- id: user-libraries
  name: Your folders (Explorer sidebar)
  path: ""
  kind: manual
  category: other
  safe: careful
  tier: userdata
  always_show: true
  describe: "The five folders Explorer shows in the sidebar - each counted ONCE here, subfolders owned by other rules excluded, zero means empty but real. OneDrive folders are a separate real location (OneDrive row below), NOT a mirror of these"
  os: [windows]
  options:
    - id: downloads
      name: Downloads
      path: "{DOWNLOADS}"
      kind: manual
      safe: careful
      always_show: true
      describe: "Installers/zips you forgot. YOUR files — review yourself"
    - id: documents
      name: Documents (outside game hubs)
      path: "{DOCUMENTS}"
      kind: manual
      safe: careful
      always_show: true
      exclude: [Bandicam, ShareX, ViberDownloads, Zoom, "Virtual Machines", ComfyUI, "My Games", "EA Games", "Rockstar Games", "Paradox Interactive", NBGI, Klei, "Sports Interactive", KoeiTecmo, "Call of Duty", "Diablo IV", "StarCraft II", "Warcraft III", "The Witcher 3", "Witcher 2", BioWare, "Euro Truck Simulator 2", "GTA San Andreas User Files", "Mount&Blade Warband Savegames", "NFS Most Wanted", "Heroes of the Storm", "Black Desert", "Guild Wars 2", "WB Games", "Tomb Raider", "Rise of the Tomb Raider", "Shadow of the Tomb Raider", "STAR WARS Battlefront II", "The Crew Motorfest", "Assetto Corsa Competizione", "Battlefield Hardline", BnS, "STAR WARS Battlefront", Shootmania, "Alpha Protocol", "Endless Space", "ANNO 1404", "Cossacks 3", Banished, "Project CARS", "Project CARS 2", "Driver San Francisco", TrackMania, Blur, Stronghold, "Combat Mission", "FC 24", "FC 25", "FC 26", Aion, "Lineage II", "Elder Scrolls Online", "Dead Space", "Anno 1800", "Battlefield 2042", "STAR WARS Squadrons", "Mount and Blade II Bannerlord", "Larian Studios", "Dyson Sphere Program", Respawn, Overwatch, "Battlefield 1"]
      describe: "Game-save folders inside are shown once, in their own rules (Games tab) - this row is your real documents. YOUR files — review yourself"
    - id: pictures
      name: Pictures (outside Screenshots)
      path: "{PICTURES}"
      kind: manual
      safe: careful
      always_show: true
      exclude: [Screenshots, "Xbox Screenshots"]
      describe: "Screenshots have their own row above; Xbox shots too. Rest of your images — review yourself"
    - id: music
      name: Music
      path: "{MUSIC}"
      kind: manual
      safe: careful
      always_show: true
      describe: "Old downloads/rips. YOUR files — review yourself"
    - id: videos
      name: Videos (outside Game Bar Captures)
      path: "{VIDEOS}"
      kind: manual
      safe: careful
      always_show: true
      exclude: [Captures]
      describe: "OBS Recording Path and ShadowPlay default here (set in Settings > Output if changed); Xbox Game Bar clips have their own row. Recordings, downloads, exports. YOUR files — review yourself"
- id: desktop-pile
  name: Desktop pile
  path: "{DESKTOP}"
  kind: manual
  category: other
  safe: careful
  tier: userdata
  describe: "The classic junkyard. YOUR files — review yourself"
  os: [windows]
- id: onedrive-mirror
  name: OneDrive cloud mirror
  path: "{ONEDRIVE}"
  discover: subfolders
  kind: manual
  category: other
  safe: careful
  tier: userdata
  describe: "Every real subfolder of OneDrive, one row each, nothing invented. Deleting local files DELETES them in the cloud too - review in Explorer; to free disk without losing cloud copies use OneDrive's own 'Free up space'. Library folders redirected here (Known Folder Move: Documents/Pictures/Desktop) are shown once, under 'Your folders' above"
  os: [windows]
  os: [windows]
- id: outlook-ost
  name: Outlook offline mail (OST)
  path: "%LOCALAPPDATA%/Microsoft/Outlook"
  kind: manual
  category: other
  program: Microsoft
  safe: careful
  tier: userdata
  describe: "Offline copies of mailboxes (GBs). Originals stay on server; compact via Account Settings > Data Files"
  os: [windows]
- id: thunderbird-mail
  name: Thunderbird mail storage
  path: ""
  kind: manual
  category: messengers
  program: Thunderbird
  safe: careful
  tier: userdata
  describe: "YOUR mails (Mail/Local Folders per profile). Compact folders in-app to shrink"
  os: [windows]
  options:
    - id: mail
      name: Mail per profile
      parent: "%APPDATA%/Thunderbird/Profiles"
      match: "*.default*/Mail"
      kind: old_versions
      safe: careful
      describe: ""
    - id: imap
      name: IMAP cache per profile
      parent: "%APPDATA%/Thunderbird/Profiles"
      match: "*.default*/ImapMail"
      kind: old_versions
      safe: careful
      describe: ""
