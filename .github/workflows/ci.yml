name: rules

on:
  push:
    branches: [master]
    paths:
      - "rules/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]

jobs:
  rules:
    runs-on: windows-latest  # the app is Windows-only; validator expands Windows envvars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python tests/test_rules.py
