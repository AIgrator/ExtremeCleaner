[project]
name = "extreme-cleaner"
version = "1.0.0"
description = "Extreme cache cleaner with user-expandable YAML rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "PySide6>=6.7",
  "Send2Trash>=1.8",
]

[project.optional-dependencies]
cli-only = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
extreme-cleaner = "extreme_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
